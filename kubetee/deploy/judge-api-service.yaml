# ClusterIP Service for the shared albedo-judge-api.
#
#   kubectl --context na-us-oakland-56-direct apply -f \
#     kubetee/deploy/judge-api-service.yaml
#
# Eval Jobs set:
#   SELFDRIVE_JUDGE_BASE_URL=http://albedo-judge-api.albedo-poc.svc.cluster.local:8091

apiVersion: v1
kind: Service
metadata:
  name: albedo-judge-api
  namespace: albedo-poc
  labels:
    app.kubernetes.io/name: albedo-judge-api
    app.kubernetes.io/part-of: kubetee-sn97-poc
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: albedo-judge-api
  ports:
    - name: http
      port: 8091
      targetPort: http
      protocol: TCP
