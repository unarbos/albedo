# Always-on albedo-king stack (ConfigMap + Deployment + Service + NetworkPolicy).
#
# Applied OUT-OF-BAND on na-us-oakland-56 (NOT Fleet-managed):
#
#   kubectl --context na-us-oakland-56-direct label node am-h200-25 \
#     kubetee.ai/albedo-king=true --overwrite
#   kubectl --context na-us-oakland-56-direct apply -f kubetee/deploy/king.yaml
#
# Challenger Jobs set:
#   ALBEDO_REMOTE_KING_BASE_URL=http://albedo-king.albedo-poc.svc.cluster.local:8000
#
# GPU cut: 4 GPUs / TP=4 on am-h200-25. For the gated 8-GPU parity follow-up,
# change nvidia.com/gpu to "8", tensor-parallel-size to 8, and give the king
# its own full node (no co-located challenger).
#
# To mark a king change (in-flight challengers get 503 king_changing):
#   kubectl -n albedo-poc exec deploy/albedo-king -c king-api -- \
#     sh -c 'echo "{\"status\":\"changing\",\"king_generation_id\":\"2\",\"king_model_uri\":\"$KING_MODEL_URI\"}" > /tmp/king-state.json'

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: albedo-king-config
  namespace: albedo-poc
  labels:
    app.kubernetes.io/name: albedo-king
    app.kubernetes.io/part-of: kubetee-sn97-poc
data:
  KING_API_HOST: "0.0.0.0"
  KING_API_PORT: "8000"
  KING_VLLM_URL: "http://127.0.0.1:8001"
  KING_STATE_PATH: "/tmp/king-state.json"
  KING_GENERATION_ID: "1"
  # Served model — keep in sync with KING_MODEL_URI on eval Jobs for parity.
  KING_MODEL_URI: "hf://wearetop/albedo-qwen3.6-35b-719@662d6efee9245b8e6a3b4c50c01130781178baec"
  KING_HF_MODEL_ID: "wearetop/albedo-qwen3.6-35b-719"
  KING_HF_REVISION: "662d6efee9245b8e6a3b4c50c01130781178baec"
  # OpenAI model id returned by vLLM / used by HttpOpenAIGenerator.
  KING_OPENAI_MODEL: "wearetop/albedo-qwen3.6-35b-719"
  KING_TENSOR_PARALLEL_SIZE: "4"
  KING_GPU_MEMORY_UTILIZATION: "0.95"
  KING_MAX_MODEL_LEN: "32768"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: albedo-king-scripts
  namespace: albedo-poc
  labels:
    app.kubernetes.io/name: albedo-king
    app.kubernetes.io/part-of: kubetee-sn97-poc
data:
  king_serve.py: |
    from __future__ import annotations
    import json, os
    from pathlib import Path
    from typing import Any
    import httpx, uvicorn
    from fastapi import FastAPI, HTTPException, Request
    from fastapi.responses import JSONResponse, Response
    _STATE_PATH = Path(os.environ.get("KING_STATE_PATH", "/tmp/king-state.json"))
    _VLLM_URL = os.environ.get("KING_VLLM_URL", "http://127.0.0.1:8001").rstrip("/")
    _MODEL_URI = os.environ.get("KING_MODEL_URI", "")
    _GENERATION_ID = os.environ.get("KING_GENERATION_ID", "1")
    _HOST = os.environ.get("KING_API_HOST", "0.0.0.0")
    _PORT = int(os.environ.get("KING_API_PORT", "8000"))
    def _default_state() -> dict[str, Any]:
        return {"status": "ready", "king_generation_id": _GENERATION_ID, "king_model_uri": _MODEL_URI}
    def _read_state() -> dict[str, Any]:
        if not _STATE_PATH.exists():
            state = _default_state()
            _STATE_PATH.parent.mkdir(parents=True, exist_ok=True)
            _STATE_PATH.write_text(json.dumps(state) + "\n")
            return state
        try:
            return json.loads(_STATE_PATH.read_text())
        except Exception:
            return _default_state()
    def create_app() -> FastAPI:
        app = FastAPI(title="albedo-king")
        @app.get("/health")
        def health() -> dict[str, str]:
            return {"status": "ok"}
        @app.get("/ready")
        def ready() -> JSONResponse:
            state = _read_state()
            status = str(state.get("status") or "ready").lower()
            payload = {
                "status": status,
                "king_generation_id": str(state.get("king_generation_id") or _GENERATION_ID),
                "king_model_uri": str(state.get("king_model_uri") or _MODEL_URI),
            }
            if status in ("changing", "king_changing"):
                return JSONResponse(status_code=503, content={**payload, "fault_code": "king_changing"})
            return JSONResponse(payload)
        @app.api_route("/v1/{path:path}", methods=["GET", "POST", "PUT", "PATCH", "DELETE"])
        async def proxy_v1(path: str, request: Request) -> Response:
            state = _read_state()
            status = str(state.get("status") or "ready").lower()
            if status in ("changing", "king_changing"):
                raise HTTPException(status_code=503, detail={
                    "fault_code": "king_changing",
                    "king_generation_id": str(state.get("king_generation_id") or _GENERATION_ID),
                    "king_model_uri": str(state.get("king_model_uri") or _MODEL_URI),
                })
            url = f"{_VLLM_URL}/v1/{path}"
            body = await request.body()
            headers = {k: v for k, v in request.headers.items() if k.lower() not in ("host", "content-length")}
            async with httpx.AsyncClient(timeout=httpx.Timeout(900.0, connect=10.0)) as client:
                upstream = await client.request(request.method, url, params=request.query_params, content=body, headers=headers)
            return Response(content=upstream.content, status_code=upstream.status_code, media_type=upstream.headers.get("content-type"))
        return app
    if __name__ == "__main__":
        uvicorn.run(create_app(), host=_HOST, port=_PORT, log_level="info")
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: albedo-king
  namespace: albedo-poc
  labels:
    app.kubernetes.io/name: albedo-king
    app.kubernetes.io/part-of: kubetee-sn97-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: albedo-king
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: albedo-king
        app.kubernetes.io/part-of: kubetee-sn97-poc
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        kubetee.ai/albedo-king: "true"
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.23.0
          imagePullPolicy: Always
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              export HF_HUB_ENABLE_HF_TRANSFER=1
              export HF_HOME=/cache/models/hf
              mkdir -p "$HF_HOME"
              echo "starting vLLM king TP=${KING_TENSOR_PARALLEL_SIZE} model=${KING_HF_MODEL_ID}@${KING_HF_REVISION}"
              exec python3 -m vllm.entrypoints.openai.api_server \
                --host 127.0.0.1 \
                --port 8001 \
                --model "${KING_HF_MODEL_ID}" \
                --revision "${KING_HF_REVISION}" \
                --served-model-name "${KING_OPENAI_MODEL}" \
                --tensor-parallel-size "${KING_TENSOR_PARALLEL_SIZE}" \
                --gpu-memory-utilization "${KING_GPU_MEMORY_UTILIZATION}" \
                --max-model-len "${KING_MAX_MODEL_LEN}" \
                --trust-remote-code \
                --enable-prefix-caching \
                --reasoning-parser qwen3
          envFrom:
            - configMapRef:
                name: albedo-king-config
            - secretRef:
                name: albedo-poc-secrets
          resources:
            limits:
              nvidia.com/gpu: "4"
              cpu: "32"
              memory: "256Gi"
            requests:
              nvidia.com/gpu: "4"
              cpu: "32"
              memory: "256Gi"
          volumeMounts:
            - name: model-cache
              mountPath: /cache/models
            - name: dshm
              mountPath: /dev/shm
            - name: king-state
              mountPath: /tmp
        - name: king-api
          image: python:3.12-slim-bookworm
          imagePullPolicy: IfNotPresent
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              pip install --no-cache-dir "fastapi>=0.115" "uvicorn[standard]>=0.30" "httpx>=0.27"
              # Wait for local vLLM before advertising Ready.
              for i in $(seq 1 600); do
                if python3 - <<'PY'
              import urllib.request
              urllib.request.urlopen("http://127.0.0.1:8001/v1/models", timeout=2)
              PY
                then
                  break
                fi
                sleep 2
              done
              python3 - <<'PY'
              import json, os
              from pathlib import Path
              path = Path(os.environ.get("KING_STATE_PATH", "/tmp/king-state.json"))
              path.write_text(json.dumps({
                  "status": "ready",
                  "king_generation_id": os.environ.get("KING_GENERATION_ID", "1"),
                  "king_model_uri": os.environ.get("KING_MODEL_URI", ""),
              }) + "\n")
              PY
              exec python3 /scripts/king_serve.py
          envFrom:
            - configMapRef:
                name: albedo-king-config
          ports:
            - name: http
              containerPort: 8000
          # king-api waits for local vLLM (weight load can take 10–30+ min) before
          # binding :8000. Without a long startupProbe, liveness SIGKILLs it (exit 137).
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 360
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            limits:
              cpu: "2"
              memory: "2Gi"
            requests:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: king-state
              mountPath: /tmp
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
        - name: model-cache
          persistentVolumeClaim:
            claimName: albedo-poc-model-cache
        - name: scripts
          configMap:
            name: albedo-king-scripts
            defaultMode: 0555
        - name: king-state
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: albedo-king
  namespace: albedo-poc
  labels:
    app.kubernetes.io/name: albedo-king
    app.kubernetes.io/part-of: kubetee-sn97-poc
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: albedo-king
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: albedo-king
  namespace: albedo-poc
  labels:
    app.kubernetes.io/name: albedo-king
    app.kubernetes.io/part-of: kubetee-sn97-poc
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: albedo-king
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: albedo-poc
      ports:
        - protocol: TCP
          port: 8000
