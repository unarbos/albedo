# KubeTEE PoC — eval ConfigMap + Job + PVCs (non-CC on am-h200-25).
#
# Applied OUT-OF-BAND on na-us-oakland-56 (NOT Fleet-managed):
#
#   kubectl --context na-us-oakland-56-direct -n albedo-poc delete job albedo-poc-eval --ignore-not-found
#   kubectl --context na-us-oakland-56-direct apply -f kubetee/deploy/eval.yaml
#
# Uses vllm/vllm-openai:v0.23.0 directly (no custom Docker image). An init
# container clones albedo code into a shared volume. The eval container mounts
# the code on top of the v0.23.0 base (correct vLLM for Qwen3.6-35B-A3B).
#
# A Job (not StatefulSet) is the right shape for a one-shot eval. Jobs don't
# support volumeClaimTemplates, so the PVCs are created explicitly.
#
# One pod == one king-of-the-hill evaluation, on one 8-GPU node (am-h200-25).
# Non-CC: runtimeClassName: nvidia (standard NVIDIA runtime).
#
# Two init containers:
#   0) inject-code — clones albedo kubetee-poc into a shared emptyDir.
#   1) prepare-dataset — downloads public HF datasets + builds manifest.json.
#
# One main container:
#   eval — runs run_eval.py; scores via shared Service albedo-judge-api:8091
#   (SELFDRIVE_JUDGE_BASE_URL). Judge is NOT a sidecar — see judge-api.yaml.
#
# All disk volumes are longhorn-v2 PVCs (no emptyDir for disk storage):
#   - model-cache (256Gi) — king + challenger safetensors (created separately /
#     retained across Jobs; claimName albedo-poc-model-cache).
#   - dataset-root (512Gi) — public HF datasets + manifest.
#   - artifacts (64Gi) — per-run spool files, uploaded to S3.
# /dev/shm and /shared are emptyDir (RAM / code inject — not disk volumes).
#
# Secrets (LiteLLM key, judge auth token, S3, HF) stay in secret-template.yaml.

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: albedo-poc-config
  namespace: albedo-poc
  labels:
    app.kubernetes.io/name: albedo-poc
    app.kubernetes.io/part-of: kubetee-sn97-poc
data:

  # ----- Remote eval worker settings (consumed by run_eval.py).
  # Judge LiteLLM URL / model tuning is on the shared judge stack
  # (judge-api.yaml), not duplicated here.
  ALBEDO_REMOTE_ACCELERATOR_TYPE: "H200"
  ALBEDO_REMOTE_GPU_COUNT: "8"
  ALBEDO_REMOTE_FREE_GPU_COUNT: "8"
  ALBEDO_REMOTE_PREVIOUS_KING_GPU_IDS: "0,1,2,3"
  ALBEDO_REMOTE_CHALLENGER_GPU_IDS: "4,5,6,7"
  ALBEDO_REMOTE_GENERATION_BACKEND: "vllm"
  ALBEDO_REMOTE_MODEL_CACHE_DIR: "/cache/models"
  ALBEDO_REMOTE_ARTIFACT_SPOOL_DIR: "/app/artifacts/spool"
  ALBEDO_REMOTE_REMOTE_STATE_DIR: "/app/artifacts/state"
  # Dataset root — the mount path of the dataset-root PVC. RemoteEvalWorker reads
  # manifest.json + parquet shards from here (remote_worker.py:258). The init
  # container writes to this path; the eval container reads from it.
  ALBEDO_REMOTE_DATASET_ROOT: "/app/dataset"

  # ----- Dataset. Active corpora (SWE-ZERO is retired — see albedo/docs/DATASETS.md:42).
  # The 4 sources are public HF datasets, downloaded by the init container via
  # scripts/prepare_datasets.py. dataset_version + sampling_algo match the
  # current albedo defaults (build_manifest.py:23 DEFAULT_VERSION + sampling.py:11 SAMPLING_ALGO).
  # manifest_hash must match the manifest.json the init container builds — set
  # after the first init-container run (the script prints the sha256). The value
  # below is a placeholder; the worker validates this hash at load_manifest_file.
  ALBEDO_EVAL_DATASET_VERSION: "mini-coder+open-swe+smith-rs+hero-v1"
  ALBEDO_EVAL_DATASET_MANIFEST_URI: "s3://sn97-albedo/datasets/manifest.json"
  ALBEDO_EVAL_DATASET_MANIFEST_HASH: "e3cff61772b0096811d4c5d8bbc8dee8dacbd9a069bc4557608adf1c1c2ddf40"

  # PoC sizing: 100 samples matches albedo production scale. The pipeline is green
  # end-to-end (3 judges, cost tracking, GPU cost) — run the real king-vs-challenger
  # comparison at production scale to get a meaningful verdict.
  ALBEDO_EVAL_SAMPLE_COUNT: "100"
  # Smaller scoring HTTP batches so a judge restart / disconnect cannot wipe
  # an entire 100-sample score-batch in one shot (default was sample_count).
  ALBEDO_EVAL_SCORING_BATCH_SIZE: "16"
  ALBEDO_EVAL_MAX_TURNS_PER_SAMPLE: "8"
  ALBEDO_EVAL_SAMPLING_ALGO: "multi-source-manifest-sample-v1"
  ALBEDO_EVAL_SAMPLE_SEED: "kubetee-poc"
  ALBEDO_EVAL_JUDGE_CONFIG_HASH: "sha256:replace-with-real-hash"
  ALBEDO_EVAL_JUDGE_COUNT: "3"

  # S3 artifact layout. The PoC writes under s3://<bucket>/kubetee-poc/<eval_run_id>/.
  # Bucket `sn97-albedo` on Hippius (https://s3.hippius.com). The uploader is generic
  # S3-API-compatible (boto3); creds come from the Secret (AWS_*), endpoint here.
  ALBEDO_EVAL_ARTIFACT_BUCKET: "sn97-albedo"
  ALBEDO_EVAL_ARTIFACT_PREFIX: "s3://sn97-albedo/kubetee-poc"

  # Hippius S3 endpoint for the artifact uploader (run_eval.py:212 reads it;
  # S3ArtifactUploader passes it to boto3 as endpoint_url). Also used by the S3
  # model resolver if a king/challenger URI is s3://...
  ALBEDO_REMOTE_S3_ENDPOINT_URL: "https://s3.hippius.com"

  # Self-drive runner (run_eval.py) tuning.
  # Auth token MUST match ALBEDO_JUDGE_API_AUTH_TOKEN on the judge Deployment
  # (same value in Secret albedo-poc-secrets).
  SELFDRIVE_SCORING_AUTH_TOKEN: "poc"
  SELFDRIVE_SCORING_TIMEOUT_SECONDS: "1800"
  # Shared judge-api Service (not an in-pod sidecar).
  SELFDRIVE_JUDGE_BASE_URL: "http://albedo-judge-api.albedo-poc.svc.cluster.local:8091"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: albedo-poc-dataset-root
  namespace: albedo-poc
  labels:
    app.kubernetes.io/name: albedo-poc
    app.kubernetes.io/part-of: kubetee-sn97-poc
spec:
  accessModes: [ReadWriteMany]
  storageClassName: longhorn-v2
  resources:
    requests:
      storage: 512Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: albedo-poc-artifacts
  namespace: albedo-poc
  labels:
    app.kubernetes.io/name: albedo-poc
    app.kubernetes.io/part-of: kubetee-sn97-poc
spec:
  accessModes: [ReadWriteMany]
  storageClassName: longhorn-v2
  resources:
    requests:
      storage: 64Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: albedo-poc-eval
  namespace: albedo-poc
  labels:
    app.kubernetes.io/name: albedo-poc
    app.kubernetes.io/part-of: kubetee-sn97-poc
spec:
  parallelism: 1
  completions: 1
  backoffLimit: 0
  activeDeadlineSeconds: 21600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: albedo-poc
        app.kubernetes.io/part-of: kubetee-sn97-poc
    spec:
      runtimeClassName: nvidia
      restartPolicy: Never

      nodeSelector:
        kubernetes.io/hostname: am-h200-25

      initContainers:
        # ----- Code injection -------------------------------------------------
        # Clone the albedo fork (KubeTEE-AI-Blueprints/albedo, kubetee-poc branch)
        # which has the JUDGE_MODELS patch + the kubetee/ PoC directory. Install
        # the albedo deps on top of the v0.23.0 base (which has vLLM + torch).
        - name: inject-code
          image: vllm/vllm-openai:v0.23.0
          imagePullPolicy: Always
          command:
            - bash
            - -c
            - |
              echo "cloning albedo fork (kubetee-poc branch)..."
              apt-get update -qq && apt-get install -y -qq git > /dev/null 2>&1
              cd /app/shared
              git clone --depth 1 --branch kubetee-poc https://github.com/KubeTEE-AI-Blueprints/albedo.git albedo
              echo "code injection complete"
          volumeMounts:
            - name: shared
              mountPath: /app/shared

        # ----- Dataset staging ------------------------------------------------
        - name: prepare-dataset
          image: vllm/vllm-openai:v0.23.0
          imagePullPolicy: Always
          command:
            - bash
            - -c
            - |
              export PYTHONPATH=/app/shared/albedo/src:/app/shared/albedo:/app/shared/albedo/scripts:$PYTHONPATH
              # Keep only models used by this Job (see KING_MODEL_URI / CHALLENGER_MODEL_URI).
              # Previous cleanup looked for .albedo-model-cache.json at the repo dir — markers
              # actually live under <repo>/<revision>/ — so the PVC filled to 100% and HF
              # fastdl failed mid-shard (model-00017). Always prune unused repos on start.
              KEEP_DIRS="wearetop__albedo-qwen3.6-35b-719 doublerabbits__albedo-qwen3.6-35b-319192"
              if [ -d /cache/models/hf ]; then
                echo "model-cache before prune:"
                df -h /cache/models | tail -1
                du -sh /cache/models/hf/*/ 2>/dev/null || true
                for d in /cache/models/hf/*/; do
                  dirname=$(basename "$d")
                  keep=0
                  for k in $KEEP_DIRS; do
                    [ "$dirname" = "$k" ] && keep=1 && break
                  done
                  if [ "$keep" -eq 0 ]; then
                    echo "pruning unused model cache: $dirname"
                    rm -rf "$d"
                  fi
                done
                echo "model-cache after prune:"
                df -h /cache/models | tail -1
                du -sh /cache/models/hf/*/ 2>/dev/null || true
              fi
              if [ -f /app/dataset/manifest.json ]; then
                echo "manifest.json exists — skipping dataset preparation (PVC retained from previous run)"
              else
                echo "manifest.json not found — running prepare_datasets.py (first run on this PVC)"
                python3 /app/shared/albedo/scripts/prepare_datasets.py --dataset-root /app/dataset
              fi
          env:
            - name: HF_HUB_ENABLE_HF_TRANSFER
              value: "1"
            - name: HF_HUB_DISABLE_PROGRESS_BARS
              value: "1"
          volumeMounts:
            - name: dataset-root
              mountPath: /app/dataset
            - name: model-cache
              mountPath: /cache/models
            - name: shared
              mountPath: /app/shared

      containers:
        # ----- Main eval container --------------------------------------------
        - name: eval
          image: vllm/vllm-openai:v0.23.0
          imagePullPolicy: Always
          command:
            - bash
            - -c
            - |
              export PYTHONPATH=/app/shared/albedo/src:/app/shared/albedo:/app/shared/albedo/scripts:/app/shared/albedo/kubetee/app:$PYTHONPATH
              cd /app/shared/albedo
              pip install --no-cache-dir --no-deps -e . && \
              pip install --no-cache-dir \
                "fastapi>=0.115" "uvicorn[standard]>=0.30" "httpx>=0.27" \
                "boto3>=1.35" "asyncpg>=0.29" "psycopg[binary]>=3.2" \
                "loguru>=0.7" "datasets" "transformers" \
                "huggingface-hub==1.19.0" "hf_transfer>=0.1" \
                "hippius-hub==0.6.0" "opensearch-py>=2,<3" \
                "prompt_toolkit>=3" "pydantic>=2.8" "pydantic-settings>=2.4" \
                "pyarrow>=16" "safetensors" "numpy"
              exec python3 /app/shared/albedo/kubetee/app/run_eval.py
          resources:
            limits:
              nvidia.com/gpu: "8"
              cpu: "32"
              memory: "512Gi"
            requests:
              nvidia.com/gpu: "8"
              cpu: "32"
              memory: "512Gi"
          env:
            # Replicating Albedo production eval b2f66cfa-6583-43d2-8570-d8a005fae7a6
            # (king v96, 100/100 scored, 0 errors, finished 2026-07-29).
            # King = wearetop/albedo-qwen3.6-35b-719 (king v96, UID 31) — public on HF.
            - name: KING_MODEL_URI
              value: "hf://wearetop/albedo-qwen3.6-35b-719@662d6efee9245b8e6a3b4c50c01130781178baec"
            - name: KING_MODEL_HASH
              value: "662d6efee9245b8e6a3b4c50c01130781178baec"
            # Challenger = doublerabbits/albedo-qwen3.6-35b-319192 (UID 156) — public on HF.
            # Lost to king with score 0.468 vs 0.528 (margin -0.059).
            - name: CHALLENGER_MODEL_URI
              value: "hf://doublerabbits/albedo-qwen3.6-35b-319192@28c27de4cc93d0c70934ba7c53b9b8076c688def"
            - name: CHALLENGER_MODEL_HASH
              value: "28c27de4cc93d0c70934ba7c53b9b8076c688def"
            # Use the exact production eval_run_id + submission_id for apple-to-apple comparison.
            - name: EVAL_RUN_ID
              value: "b2f66cfa-6583-43d2-8570-d8a005fae7a6"
            - name: SUBMISSION_ID
              value: "b6ef1319-cde5-4d35-8fc4-0b175ffb3753"
            # Override ConfigMap if needed; default is the shared Service DNS.
            - name: SELFDRIVE_JUDGE_BASE_URL
              value: "http://albedo-judge-api.albedo-poc.svc.cluster.local:8091"
          envFrom:
            - configMapRef:
                name: albedo-poc-config
            - secretRef:
                name: albedo-poc-secrets
          volumeMounts:
            - name: artifacts
              mountPath: /app/artifacts
            - name: dataset-root
              mountPath: /app/dataset
            - name: model-cache
              mountPath: /cache/models
            - name: dshm
              mountPath: /dev/shm
            - name: shared
              mountPath: /app/shared

      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
        - name: shared
          emptyDir: {}
        - name: model-cache
          persistentVolumeClaim:
            claimName: albedo-poc-model-cache
        - name: dataset-root
          persistentVolumeClaim:
            claimName: albedo-poc-dataset-root
        - name: artifacts
          persistentVolumeClaim:
            claimName: albedo-poc-artifacts
