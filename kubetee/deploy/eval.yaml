# KubeTEE PoC — challenger eval ConfigMap + Job + PVCs (non-CC).
#
# Applied OUT-OF-BAND on na-us-oakland-56 (NOT Fleet-managed).
#
# Apply ORDER (required):
#   1. kubectl apply -f kubetee/deploy/dataset-prep.yaml   # once / on corpus bump
#   2. wait job/albedo-poc-dataset-prep Complete
#   3. kubectl apply -f kubetee/deploy/king.yaml           # king owns 4 GPUs first
#   4. kubectl -n albedo-poc rollout status deploy/albedo-king --timeout=45m
#   5. GET http://albedo-king...:8000/ready → status ready
#   6. THEN delete+apply this eval Job
#
#   kubectl --context na-us-oakland-56-direct -n albedo-poc delete job albedo-poc-eval --ignore-not-found
#   kubectl --context na-us-oakland-56-direct apply -f kubetee/deploy/eval.yaml
#
# Challenger-only Job (4 GPU / TP=4). Corpus lives on albedo-poc-dataset-root
# (filled by dataset-prep.yaml). This Job only checks the manifest hash, prunes
# the model-cache, and samples N IDs per run. Previous-king generation goes to
# the always-on albedo-king Service (see king.yaml). wait-for-king blocks until
# /ready so we never start local vLLM against a cold king.
#
# For concurrent challengers: join a second non-CC H200 and submit a second
# Job with a distinct EVAL_RUN_ID (king already owns 4 GPUs on am-h200-25).
#
# Secrets stay in secret-template.yaml. Judge stack: judge-api.yaml.

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: albedo-poc-config
  namespace: albedo-poc
  labels:
    app.kubernetes.io/name: albedo-poc
    app.kubernetes.io/part-of: kubetee-sn97-poc
data:

  # ----- Remote eval worker settings (consumed by run_eval.py).
  ALBEDO_REMOTE_ACCELERATOR_TYPE: "H200"
  # Challenger-only local GPUs (king is remote HTTP).
  ALBEDO_REMOTE_GPU_COUNT: "4"
  ALBEDO_REMOTE_FREE_GPU_COUNT: "4"
  ALBEDO_REMOTE_MIN_GPUS: "4"
  ALBEDO_REMOTE_PREFERRED_GPUS: "4"
  ALBEDO_REMOTE_PREVIOUS_KING_GPU_COUNT: "0"
  ALBEDO_REMOTE_CHALLENGER_GPU_COUNT: "4"
  ALBEDO_REMOTE_TENSOR_PARALLEL_SIZE_PER_MODEL: "4"
  ALBEDO_REMOTE_PREVIOUS_KING_GPU_IDS: ""
  ALBEDO_REMOTE_CHALLENGER_GPU_IDS: "0,1,2,3"
  ALBEDO_REMOTE_GENERATION_BACKEND: "vllm"
  ALBEDO_REMOTE_KING_BASE_URL: "http://albedo-king.albedo-poc.svc.cluster.local:8000"
  ALBEDO_REMOTE_KING_OPENAI_MODEL: "tojointhecommunity/albedo-qwen3.6-35b-top"
  ALBEDO_REMOTE_CLEANUP_STALE_VLLM: "false"
  ALBEDO_REMOTE_MODEL_CACHE_DIR: "/cache/models"
  ALBEDO_REMOTE_ARTIFACT_SPOOL_DIR: "/app/artifacts/spool"
  ALBEDO_REMOTE_REMOTE_STATE_DIR: "/app/artifacts/state"
  # Dataset version / manifest hash / root: albedo-poc-dataset-config
  # (deploy/dataset-prep.yaml). Eval envFrom merges that ConfigMap.

  # Match public Albedo reference ca530856 (see kubetee/compare/reference-ca530856-*).
  # 100 samples / batch 32 → 4 gen batches + 4 score batches; judge_count=1 (glm-5.2).
  #
  # Apple-to-apple dataset pin: exact sample_ids from Denrite reference
  # request.json (manifest_hash e3cff617… — same as albedo-poc-dataset-config).
  # When SAMPLE_IDS_FILE is set, run_eval loads dataset.sample_ids and does NOT
  # re-sample from ALBEDO_EVAL_SAMPLE_SEED (PoC run 7e09f071 used seed-only and
  # had 0 overlap with this reference set).
  ALBEDO_EVAL_SAMPLE_IDS_FILE: "/app/shared/albedo/kubetee/compare/reference-ca530856-ffa8-4e66-9175-7400e829e8c0/request.json"
  ALBEDO_EVAL_SAMPLE_COUNT: "100"
  ALBEDO_EVAL_GENERATION_BATCH_SIZE: "32"
  ALBEDO_EVAL_SCORING_BATCH_SIZE: "32"
  # Parallel /score-batch HTTP calls from the eval worker (RemoteSettings default).
  ALBEDO_REMOTE_SCORING_BATCH_CONCURRENCY: "128"
  ALBEDO_EVAL_MAX_TURNS_PER_SAMPLE: "8"
  ALBEDO_EVAL_SAMPLING_ALGO: "multi-source-manifest-sample-v1"
  # Ignored while SAMPLE_IDS_FILE / SAMPLE_IDS are set (kept for smoke/seeded runs).
  ALBEDO_EVAL_SAMPLE_SEED: "kubetee-poc"
  ALBEDO_EVAL_JUDGE_CONFIG_HASH: "sha256:replace-with-real-hash"
  # count=1 → glm only (hardcoded JUDGE_MODELS order; count=2 still includes 397B).
  ALBEDO_EVAL_JUDGE_COUNT: "1"

  ALBEDO_EVAL_ARTIFACT_BUCKET: "sn97-albedo"
  ALBEDO_EVAL_ARTIFACT_PREFIX: "s3://sn97-albedo/kubetee-poc"
  ALBEDO_REMOTE_S3_ENDPOINT_URL: "https://s3.hippius.com"

  SELFDRIVE_SCORING_AUTH_TOKEN: "poc"
  # Per /score-batch HTTP read timeout (glm-only panel; keep headroom).
  SELFDRIVE_SCORING_TIMEOUT_SECONDS: "5400"
  SELFDRIVE_JUDGE_BASE_URL: "http://albedo-judge-api.albedo-poc.svc.cluster.local:8091"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: albedo-poc-artifacts
  namespace: albedo-poc
  labels:
    app.kubernetes.io/name: albedo-poc
    app.kubernetes.io/part-of: kubetee-sn97-poc
spec:
  accessModes: [ReadWriteMany]
  storageClassName: longhorn-v2
  resources:
    requests:
      storage: 64Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: albedo-poc-eval
  namespace: albedo-poc
  labels:
    app.kubernetes.io/name: albedo-poc
    app.kubernetes.io/part-of: kubetee-sn97-poc
spec:
  parallelism: 1
  completions: 1
  backoffLimit: 0
  activeDeadlineSeconds: 21600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: albedo-poc
        app.kubernetes.io/part-of: kubetee-sn97-poc
    spec:
      runtimeClassName: nvidia
      restartPolicy: Never
      # Prefer non-CC H200 workers; avoid the king node when possible so the
      # always-on king keeps its 4 GPUs. Soft preference — still schedules if
      # only the king node has free GPUs.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubetee.ai/albedo-king
                    operator: DoesNotExist
            - weight: 50
              preference:
                matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values: ["NVIDIA-H200", "NVIDIA H200", "GH100_H200_SXM_141GB"]

      initContainers:
        - name: inject-code
          image: vllm/vllm-openai:v0.23.0
          imagePullPolicy: Always
          command:
            - bash
            - -c
            - |
              echo "cloning albedo fork (kubetee-poc branch)..."
              apt-get update -qq && apt-get install -y -qq git > /dev/null 2>&1
              cd /app/shared
              git clone --depth 1 --branch kubetee-poc https://github.com/KubeTEE-AI-Blueprints/albedo.git albedo
              echo "code injection complete"
          volumeMounts:
            - name: shared
              mountPath: /app/shared

        # Fail fast if corpus prep Job was not run (or hash drifted).
        - name: check-dataset-manifest
          image: busybox:1.37
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              EXPECTED="${ALBEDO_EVAL_DATASET_MANIFEST_HASH:?ALBEDO_EVAL_DATASET_MANIFEST_HASH required}"
              EXPECTED="${EXPECTED#sha256:}"
              MANIFEST=/app/dataset/manifest.json
              if [ ! -f "$MANIFEST" ]; then
                echo "ERROR: ${MANIFEST} missing — apply/run kubetee/deploy/dataset-prep.yaml first" >&2
                exit 1
              fi
              ACTUAL=$(sha256sum "$MANIFEST" | awk '{print $1}')
              if [ "$ACTUAL" != "$EXPECTED" ]; then
                echo "ERROR: dataset manifest hash mismatch" >&2
                echo "  expected: ${EXPECTED}" >&2
                echo "  actual:   ${ACTUAL}" >&2
                echo "Re-run dataset-prep Job or update albedo-poc-dataset-config" >&2
                exit 1
              fi
              echo "dataset manifest hash OK (${ACTUAL})"
          env:
            - name: ALBEDO_EVAL_DATASET_MANIFEST_HASH
              valueFrom:
                configMapKeyRef:
                  name: albedo-poc-dataset-config
                  key: ALBEDO_EVAL_DATASET_MANIFEST_HASH
          volumeMounts:
            - name: dataset-root
              mountPath: /app/dataset

        # Eval/node-local HF cache hygiene (not corpus ownership).
        - name: prune-model-cache
          image: busybox:1.37
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              KEEP_DIRS="tojointhecommunity__albedo-qwen3.6-35b-top bkn1890__albedo-qwen3.6-35b-hk971"
              if [ ! -d /cache/models/hf ]; then
                echo "no /cache/models/hf — skip prune"
                exit 0
              fi
              echo "model-cache before prune:"
              df -h /cache/models | tail -1
              du -sh /cache/models/hf/*/ 2>/dev/null || true
              for d in /cache/models/hf/*/; do
                dirname=$(basename "$d")
                keep=0
                for k in $KEEP_DIRS; do
                  [ "$dirname" = "$k" ] && keep=1 && break
                done
                if [ "$keep" -eq 0 ]; then
                  echo "pruning unused model cache: $dirname"
                  rm -rf "$d"
                fi
              done
              echo "model-cache after prune:"
              df -h /cache/models | tail -1
              du -sh /cache/models/hf/*/ 2>/dev/null || true
          volumeMounts:
            - name: model-cache
              mountPath: /cache/models

        # Block until always-on king is serving. Run last so inject/checks
        # can overlap king weight load when both schedule together.
        - name: wait-for-king
          image: curlimages/curl:8.11.1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              URL="${ALBEDO_REMOTE_KING_BASE_URL:-http://albedo-king.albedo-poc.svc.cluster.local:8000}/ready"
              echo "waiting for king ready at ${URL}"
              for i in $(seq 1 900); do
                code=$(curl -sS -o /tmp/king-ready.json -w '%{http_code}' --connect-timeout 2 --max-time 5 "$URL" || true)
                if [ "$code" = "200" ]; then
                  status=$(sed -n 's/.*"status"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' /tmp/king-ready.json | head -1)
                  if [ "$status" = "ready" ] || [ -z "$status" ]; then
                    echo "king ready (HTTP 200): $(cat /tmp/king-ready.json)"
                    exit 0
                  fi
                fi
                echo "king not ready yet (http=${code:-err}) attempt=${i}/900"
                sleep 2
              done
              echo "timed out waiting for king /ready" >&2
              exit 1
          env:
            - name: ALBEDO_REMOTE_KING_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: albedo-poc-config
                  key: ALBEDO_REMOTE_KING_BASE_URL

      containers:
        - name: eval
          image: vllm/vllm-openai:v0.23.0
          imagePullPolicy: Always
          command:
            - bash
            - -c
            - |
              export PYTHONPATH=/app/shared/albedo/src:/app/shared/albedo:/app/shared/albedo/scripts:/app/shared/albedo/kubetee/app${PYTHONPATH:+:$PYTHONPATH}
              cd /app/shared/albedo
              pip install --no-cache-dir --no-deps -e . && \
              pip install --no-cache-dir \
                "fastapi>=0.115" "uvicorn[standard]>=0.30" "httpx>=0.27" \
                "boto3>=1.35" "asyncpg>=0.29" "psycopg[binary]>=3.2" \
                "loguru>=0.7" "datasets" "transformers" \
                "huggingface-hub==1.19.0" "hf_transfer>=0.1" \
                "hippius-hub==0.6.0" "opensearch-py>=2,<3" \
                "prompt_toolkit>=3" "pydantic>=2.8" "pydantic-settings>=2.4" \
                "pyarrow>=16" "safetensors" "numpy"
              exec python3 /app/shared/albedo/kubetee/app/run_eval.py
          resources:
            limits:
              nvidia.com/gpu: "4"
              cpu: "32"
              memory: "256Gi"
            requests:
              nvidia.com/gpu: "4"
              cpu: "32"
              memory: "256Gi"
          env:
            - name: KING_MODEL_URI
              value: "hf://tojointhecommunity/albedo-qwen3.6-35b-top@438aec1140de06268cc36b79dc9567129678888c"
            - name: KING_MODEL_HASH
              value: "438aec1140de06268cc36b79dc9567129678888c"
            - name: CHALLENGER_MODEL_URI
              value: "hf://bkn1890/albedo-qwen3.6-35b-hk971@1ba87c52697f154a8f75a33ddf5714c1d314bcc7"
            - name: CHALLENGER_MODEL_HASH
              value: "1ba87c52697f154a8f75a33ddf5714c1d314bcc7"
            # Apple-to-apple vs Denrite ca530856 (pinned sample_ids from request.json).
            # Complete 9a0f5f09…: chal 0.68715 / king 0.665788 (+2.14pp), 100/100.
            # Prior pin: 3e60c4c8… (0.6809/0.6785, 100/100); e6c56798… (99/100, 1 king err).
            - name: EVAL_RUN_ID
              value: "9a0f5f09-812d-48ee-b3ad-5d91c5210391"
            - name: SUBMISSION_ID
              value: "b0c4a6da-ef58-42f2-a521-2245446d1c74"
            - name: SELFDRIVE_JUDGE_BASE_URL
              value: "http://albedo-judge-api.albedo-poc.svc.cluster.local:8091"
          envFrom:
            - configMapRef:
                name: albedo-poc-config
            - configMapRef:
                name: albedo-poc-dataset-config
            - secretRef:
                name: albedo-poc-secrets
          volumeMounts:
            - name: artifacts
              mountPath: /app/artifacts
            - name: dataset-root
              mountPath: /app/dataset
            - name: model-cache
              mountPath: /cache/models
            - name: dshm
              mountPath: /dev/shm
            - name: shared
              mountPath: /app/shared

      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
        - name: shared
          emptyDir: {}
        - name: model-cache
          persistentVolumeClaim:
            claimName: albedo-poc-model-cache
        - name: dataset-root
          persistentVolumeClaim:
            claimName: albedo-poc-dataset-root
        - name: artifacts
          persistentVolumeClaim:
            claimName: albedo-poc-artifacts
