# KubeTEE PoC Secret template for the albedo evaluation pod.
#
# This file is a TEMPLATE only — NEVER commit real secrets to git. Apply a
# real Secret out-of-band on the na-us-oakland-56 cluster per
# fleet-gitops/infrastructure/SECRET-MANAGEMENT-STRATEGY.md:
#
#   # Fill in the values locally (keep the file outside the repo):
#   $ cp kubetee/deploy/secret-template.yaml ~/kubetee-secret-backends/albedo-poc-secrets.yaml
#   $ $EDITOR ~/kubetee-secret-backends/albedo-poc-secrets.yaml
#   $ kubectl --context na-us-oakland-56-direct apply -f \
#       ~/kubetee-secret-backends/albedo-poc-secrets.yaml
#
# Then register the Secret name + namespace + consumer in the inventory table
# in SECRET-MANAGEMENT-STRATEGY.md (never the values).
#
# Rotate by re-applying a new Secret and deleting the albedo-poc pods so they
# pick up the new env on restart.

apiVersion: v1
kind: Secret
metadata:
  name: albedo-poc-secrets
  namespace: albedo-poc
  labels:
    app.kubernetes.io/name: albedo-poc
    app.kubernetes.io/part-of: kubetee-sn97-poc
type: Opaque
stringData:
  # LiteLLM virtual key for the judge_api to authenticate against
  # https://llm.kubetee.ai. Minted via the LiteLLM admin UI (/ui) or
  # POST /key/generate on the gateway; the key is stored in the litellm-pg
  # Postgres with spend limits and rate-limit group policy.
  ALBEDO_JUDGE_OPENROUTER_API_KEY: "REPLACE_WITH_LITELLM_VIRTUAL_KEY"

  # HuggingFace token — only needed if the challenger or king model lives in
  # a private/gated HF repo. Leave blank (empty string) for public refs.
  HF_TOKEN: ""

  # S3 credentials for the artifact upload path. If using Hippius S3
  # (s3.hippius.com), fill these with the Hippius access key/secret. If using
  # our Cloudflare R2, use the R2 access key/secret and ALSO set
  # ALBEDO_REMOTE_S3_ENDPOINT_URL in the ConfigMap to the R2 endpoint.
  AWS_ACCESS_KEY_ID: "REPLACE_WITH_S3_ACCESS_KEY_ID"
  AWS_SECRET_ACCESS_KEY: "REPLACE_WITH_S3_SECRET_ACCESS_KEY"
  # AWS_SESSION_TOKEN: ""  # uncomment if using temporary STS credentials
