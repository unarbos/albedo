# KubeTEE PoC — Job for one king-of-the-hill evaluation (non-CC on am-h200-25).
#
# Uses vllm/vllm-openai:v0.23.0 directly (no custom Docker image). An init
# container copies the albedo code + deps from the old PoC image into a shared
# volume. The eval + judge-api containers mount the code + deps on top of the
# v0.23.0 base (which has the correct vLLM for Qwen3.6-35B-A3B).
#
# A Job (not StatefulSet) is the right shape for a one-shot eval. Jobs don't
# support volumeClaimTemplates, so the 3 PVCs are created explicitly.
#
# One pod == one king-of-the-hill evaluation, on one 8-GPU node (am-h200-25).
# Non-CC: runtimeClassName: nvidia (standard NVIDIA runtime).
#
# Three init containers:
#   0) inject-code — copies albedo code + pip-installed deps from the old PoC
#      image into a shared emptyDir, so the v0.23.0 containers can use them.
#   1) prepare-dataset — downloads public HF datasets + builds manifest.json.
#
# Two main containers:
#   0) eval — runs run_eval.py (drives the evaluation, exits when done).
#   1) judge-api — sidecar running albedo-judge-api, exits when eval finishes.
#
# All disk volumes are longhorn-v2 PVCs (no emptyDir for disk storage):
#   - model-cache (256Gi) — king + challenger safetensors.
#   - dataset-root (512Gi) — public HF datasets + manifest.
#   - artifacts (64Gi) — per-run spool files, uploaded to S3.
# /dev/shm and /shared are emptyDir (RAM/marker — not disk volumes).

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: albedo-poc-dataset-root
  namespace: albedo-poc
  labels:
    app.kubernetes.io/name: albedo-poc
    app.kubernetes.io/part-of: kubetee-sn97-poc
spec:
  accessModes: [ReadWriteMany]
  storageClassName: longhorn-v2
  resources:
    requests:
      storage: 512Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: albedo-poc-artifacts
  namespace: albedo-poc
  labels:
    app.kubernetes.io/name: albedo-poc
    app.kubernetes.io/part-of: kubetee-sn97-poc
spec:
  accessModes: [ReadWriteMany]
  storageClassName: longhorn-v2
  resources:
    requests:
      storage: 64Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: albedo-poc-eval
  namespace: albedo-poc
  labels:
    app.kubernetes.io/name: albedo-poc
    app.kubernetes.io/part-of: kubetee-sn97-poc
spec:
  parallelism: 1
  completions: 1
  backoffLimit: 0
  activeDeadlineSeconds: 21600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: albedo-poc
        app.kubernetes.io/part-of: kubetee-sn97-poc
    spec:
      runtimeClassName: nvidia
      restartPolicy: Never

      nodeSelector:
        kubernetes.io/hostname: am-h200-25

      initContainers:
        # ----- Code injection -------------------------------------------------
        # The old PoC image has all the albedo code + pip-installed deps but the
        # wrong vLLM (0.22.1-dev). This init container copies the code + deps
        # from it into a shared emptyDir. The eval + judge containers use the
        # correct vllm/vllm-openai:v0.23.0 base but mount the injected code.
        - name: inject-code
          image: ghcr.io/kubetee-ai/albedo-poc:latest
          imagePullPolicy: Always
          command:
            - bash
            - -c
            - |
              echo "injecting albedo code + deps from old PoC image..."
              cp -a /app/src /app/shared/
              cp -a /app/scripts /app/shared/
              cp -a /app/assets /app/shared/
              cp -a /app/chain.toml /app/shared/
              cp -a /app/kubetee /app/shared/
              cp -a /app/pyproject.toml /app/shared/
              # Copy the pip-installed site-packages (albedo deps like fastapi,
              # boto3, huggingface-hub, hippius-hub, etc.) so the v0.23.0 image
              # doesn't need to re-install them. The vLLM + torch from v0.23.0
              # take precedence (they're in the base image's site-packages, which
              # is on PYTHONPATH before the injected site-packages).
              # Instead of copying all site-packages (too large + conflicts with
              # v0.23.0's torch/vllm), just install the albedo deps fresh:
              pip install --no-cache-dir --no-deps -e /app/shared/
              pip install --no-cache-dir \
                "fastapi>=0.115" "uvicorn[standard]>=0.30" "httpx>=0.27" \
                "boto3>=1.35" "asyncpg>=0.29" "psycopg[binary]>=3.2" \
                "loguru>=0.7" "datasets" "transformers" \
                "huggingface-hub==1.19.0" "hf_transfer>=0.1" \
                "hippius-hub==0.6.0" "opensearch-py>=2,<3" \
                "prompt_toolkit>=3" "pydantic>=2.8" "pydantic-settings>=2.4" \
                "pyarrow>=16" "safetensors" "numpy"
              echo "code injection complete"
          volumeMounts:
            - name: shared
              mountPath: /app/shared

        # ----- Dataset staging ------------------------------------------------
        - name: prepare-dataset
          image: ghcr.io/kubetee-ai/albedo-poc:latest
          imagePullPolicy: Always
          command:
            - bash
            - -c
            - |
              KING_DIR="dendriteholdings__albedo-qwen3.6-35b-king-genesis"
              if [ -d /cache/models/hf ]; then
                for d in /cache/models/hf/*/; do
                  dirname=$(basename "$d")
                  if [ "$dirname" != "$KING_DIR" ]; then
                    marker="$d.albedo-model-cache.json"
                    if [ -f "$marker" ] && [ "$(find "$marker" -mmin +60 2>/dev/null)" ]; then
                      echo "cleaning stale challenger: $dirname"
                      rm -rf "$d"
                    fi
                  fi
                done
              fi
              if [ -f /app/dataset/manifest.json ]; then
                echo "manifest.json exists — skipping dataset preparation (PVC retained from previous run)"
              else
                echo "manifest.json not found — running prepare_datasets.py (first run on this PVC)"
                python /app/scripts/prepare_datasets.py --dataset-root /app/dataset
              fi
          env:
            - name: HF_HUB_ENABLE_HF_TRANSFER
              value: "1"
            - name: HF_HUB_DISABLE_PROGRESS_BARS
              value: "1"
          volumeMounts:
            - name: dataset-root
              mountPath: /app/dataset
            - name: model-cache
              mountPath: /cache/models

      containers:
        # ----- Main eval container --------------------------------------------
        - name: eval
          image: vllm/vllm-openai:v0.23.0
          imagePullPolicy: Always
          command:
            - bash
            - -c
            - |
              export PYTHONPATH=/app/shared/src:/app/shared:/app/shared/scripts:$PYTHONPATH
              python /app/shared/kubetee/app/run_eval.py; EXIT=$?
              touch /shared/eval-done
              exit $EXIT
          resources:
            limits:
              nvidia.com/gpu: "8"
              cpu: "32"
              memory: "512Gi"
            requests:
              nvidia.com/gpu: "8"
              cpu: "32"
              memory: "512Gi"
          env:
            - name: KING_MODEL_URI
              value: "hf://dendriteholdings/albedo-qwen3.6-35b-king-genesis@d7934c55d650e3a73de3081c11ad2c864009f4b7"
            - name: KING_MODEL_HASH
              value: "d7934c55d650e3a73de3081c11ad2c864009f4b7"
            - name: CHALLENGER_MODEL_URI
              value: "hf://Qwen/Qwen3.6-35B-A3B@995ad96eacd98c81ed38be0c5b274b04031597b0"
            - name: CHALLENGER_MODEL_HASH
              value: "995ad96eacd98c81ed38be0c5b274b04031597b0"
            - name: EVAL_RUN_ID
              value: "00000000-0000-0000-0000-000000000002"
            - name: SUBMISSION_ID
              value: "00000000-0000-0000-0000-000000000002"
            - name: SELFDRIVE_JUDGE_BASE_URL
              value: "http://127.0.0.1:8091"
          envFrom:
            - configMapRef:
                name: albedo-poc-config
            - secretRef:
                name: albedo-poc-secrets
          volumeMounts:
            - name: artifacts
              mountPath: /app/artifacts
            - name: dataset-root
              mountPath: /app/dataset
            - name: model-cache
              mountPath: /cache/models
            - name: dshm
              mountPath: /dev/shm
            - name: shared
              mountPath: /shared
            - name: injected-code
              mountPath: /app/shared
              readOnly: true

        # ----- Judge-api sidecar ----------------------------------------------
        - name: judge-api
          image: vllm/vllm-openai:v0.23.0
          imagePullPolicy: Always
          command:
            - bash
            - -c
            - |
              export PYTHONPATH=/app/shared/src:/app/shared:/app/shared/scripts:$PYTHONPATH
              albedo-judge-api &
              JUDGE_PID=$!
              while [ ! -f /shared/eval-done ]; do
                sleep 5
              done
              echo "eval container done — shutting down judge-api"
              kill $JUDGE_PID 2>/dev/null
              wait $JUDGE_PID 2>/dev/null
              exit 0
          resources:
            limits:
              cpu: "4"
              memory: "8Gi"
            requests:
              cpu: "4"
              memory: "8Gi"
          envFrom:
            - configMapRef:
                name: albedo-poc-config
            - secretRef:
                name: albedo-poc-secrets
          env:
            - name: SELFDRIVE_JUDGE_BASE_URL
              value: "http://127.0.0.1:8091"
          ports:
            - name: judge-http
              containerPort: 8091
          readinessProbe:
            httpGet:
              path: /ready
              port: 8091
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: shared
              mountPath: /shared
            - name: injected-code
              mountPath: /app/shared
              readOnly: true

      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
        - name: shared
          emptyDir: {}
        - name: injected-code
          emptyDir: {}
        - name: model-cache
          persistentVolumeClaim:
            claimName: albedo-poc-model-cache
        - name: dataset-root
          persistentVolumeClaim:
            claimName: albedo-poc-dataset-root
        - name: artifacts
          persistentVolumeClaim:
            claimName: albedo-poc-artifacts
