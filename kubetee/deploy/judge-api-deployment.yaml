# Shared albedo-judge-api Deployment (replicas=1 — in-memory QuestionPrepStore).
#
#   kubectl --context na-us-oakland-56-direct apply -f \
#     kubetee/deploy/judge-api-deployment.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: albedo-judge-api
  namespace: albedo-poc
  labels:
    app.kubernetes.io/name: albedo-judge-api
    app.kubernetes.io/part-of: kubetee-sn97-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: albedo-judge-api
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: albedo-judge-api
        app.kubernetes.io/part-of: kubetee-sn97-poc
    spec:
      containers:
        - name: judge-api
          image: ghcr.io/kubetee-ai/albedo-judge-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8091
          envFrom:
            - configMapRef:
                name: albedo-judge-config
            - secretRef:
                name: albedo-poc-secrets
          resources:
            limits:
              cpu: "4"
              memory: "16Gi"
            requests:
              cpu: "4"
              memory: "16Gi"
          # /health and /ready are unauthenticated so kubelet probes work
          # behind NetworkPolicy (host→pod probe traffic is not ns-sourced).
          # Liveness is intentionally loose: a full /score-batch can keep the
          # event loop busy for minutes; a tight probe SIGKILLs mid-score
          # (PROVIDER_FAULT / judge_provider_exhausted on the eval Job).
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
