# Ingress-only NetworkPolicy: TCP/8091 only from pods in albedo-poc.
# Egress is unrestricted so judge can reach CoreDNS + LiteLLM.
#
#   kubectl --context na-us-oakland-56-direct apply -f \
#     kubetee/deploy/judge-api-networkpolicy.yaml
#
# After apply, verify the judge Deployment stays Ready (kubelet probes are
# host-sourced; if Ready flips False, add a narrow Calico host allow).

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: albedo-judge-api
  namespace: albedo-poc
  labels:
    app.kubernetes.io/name: albedo-judge-api
    app.kubernetes.io/part-of: kubetee-sn97-poc
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: albedo-judge-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: albedo-poc
      ports:
        - protocol: TCP
          port: 8091
