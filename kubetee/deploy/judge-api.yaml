# Shared albedo-judge-api stack (ConfigMap + Deployment + Service + NetworkPolicy).
#
# Applied OUT-OF-BAND on na-us-oakland-56 (NOT Fleet-managed):
#
#   kubectl --context na-us-oakland-56-direct apply -f \
#     kubetee/deploy/judge-api.yaml
#
# Eval Jobs set:
#   SELFDRIVE_JUDGE_BASE_URL=http://albedo-judge-api.albedo-poc.svc.cluster.local:8091
#
# Auth token lives in Secret albedo-poc-secrets (ALBEDO_JUDGE_API_AUTH_TOKEN)
# and must match SELFDRIVE_SCORING_AUTH_TOKEN on eval Jobs.
# Eval GPU/dataset keys stay in eval.yaml.

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: albedo-judge-config
  namespace: albedo-poc
  labels:
    app.kubernetes.io/name: albedo-judge-api
    app.kubernetes.io/part-of: kubetee-sn97-poc
data:
  ALBEDO_JUDGE_OPENROUTER_BASE_URL: "http://litellm.litellm.svc.cluster.local:4000"
  ALBEDO_JUDGE_EVALUATOR_MODEL: "z-ai/glm-5.2"
  ALBEDO_JUDGE_SOTA_MODELS: "z-ai/glm-5.2"
  ALBEDO_JUDGE_TEMPERATURE: "0.0"
  ALBEDO_JUDGE_MAX_TOKENS: "768"
  # Match long glm judge completions (often 150–280s); was 300 < LATENCY_MAX.
  ALBEDO_JUDGE_REQUEST_TIMEOUT_SECONDS: "480"
  ALBEDO_JUDGE_RETRY_COUNT: "5"
  # GLM B200 CC: balanced recipe with max-running=64 (2026-08-10).
  # Cap judge ≤ backend: start/ceiling 64, floor 32, sample concurrency 48.
  ALBEDO_JUDGE_MAX_CONCURRENCY_PER_MODEL: "64"
  ALBEDO_JUDGE_MAX_SCORE_SAMPLE_CONCURRENCY: "48"
  ALBEDO_JUDGE_ADAPTIVE_CONCURRENCY_ENABLED: "true"
  ALBEDO_JUDGE_ADAPTIVE_CONCURRENCY_MAX: "64"
  ALBEDO_JUDGE_ADAPTIVE_CONCURRENCY_MIN: "32"
  ALBEDO_JUDGE_ADAPTIVE_HOLD_RATIO: "0.9"
  ALBEDO_JUDGE_ADAPTIVE_RAMP_EVERY_SUCCESSES: "8"
  ALBEDO_JUDGE_ADAPTIVE_COOLDOWN_SUCCESSES: "16"
  # Latency: warn from first request if > LATENCY_MAX_SECONDS; after start
  # baseline (median of first N), also warn at baseline × LATENCY_MAX_RATIO.
  # 3 consecutive OOR completions trigger the same hold as a 429.
  # 360s: glm-5.2 judge calls often take 150–280s (large completion/reasoning
  # usage). The old 60s absolute floor + stale ~46s baseline (×3 ≈137s) held
  # adaptive concurrency at MIN=32. Bumped 2026-08-09 mid-eval.
  ALBEDO_JUDGE_LATENCY_MAX_SECONDS: "360"
  ALBEDO_JUDGE_LATENCY_MAX_RATIO: "3.0"
  ALBEDO_JUDGE_LATENCY_BASELINE_SAMPLES: "8"
  ALBEDO_JUDGE_LATENCY_OOR_STRIKES_BEFORE_HOLD: "3"
  ALBEDO_JUDGE_MIN_VALID_FRACTION: "0.5"
  ALBEDO_JUDGE_API_HOST: "0.0.0.0"
  ALBEDO_JUDGE_API_PORT: "8091"
---
# replicas=1 — in-memory QuestionPrepStore is not shared across pods.
# RollingUpdate (maxSurge=1): brief dual-pod window during rollout only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: albedo-judge-api
  namespace: albedo-poc
  labels:
    app.kubernetes.io/name: albedo-judge-api
    app.kubernetes.io/part-of: kubetee-sn97-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: albedo-judge-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: albedo-judge-api
        app.kubernetes.io/part-of: kubetee-sn97-poc
    spec:
      containers:
        - name: judge-api
          image: ghcr.io/kubetee-ai/albedo-judge-api:main-merge-20260810221000
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8091
          envFrom:
            - configMapRef:
                name: albedo-judge-config
            - secretRef:
                name: albedo-poc-secrets
          resources:
            limits:
              cpu: "4"
              memory: "16Gi"
            requests:
              cpu: "4"
              memory: "16Gi"
          # /health and /ready are unauthenticated so kubelet probes work
          # behind NetworkPolicy (host→pod probe traffic is not ns-sourced).
          # Liveness is intentionally loose: a full /score-batch can keep the
          # event loop busy for minutes; a tight probe SIGKILLs mid-score
          # (PROVIDER_FAULT / judge_provider_exhausted on the eval Job).
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: albedo-judge-api
  namespace: albedo-poc
  labels:
    app.kubernetes.io/name: albedo-judge-api
    app.kubernetes.io/part-of: kubetee-sn97-poc
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: albedo-judge-api
  ports:
    - name: http
      port: 8091
      targetPort: http
      protocol: TCP
---
# Ingress-only: TCP/8091 from pods in albedo-poc. Egress unrestricted
# (CoreDNS + LiteLLM). After apply, verify Deployment stays Ready — kubelet
# probes are host-sourced; if Ready flips False, add a narrow Calico host allow.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: albedo-judge-api
  namespace: albedo-poc
  labels:
    app.kubernetes.io/name: albedo-judge-api
    app.kubernetes.io/part-of: kubetee-sn97-poc
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: albedo-judge-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: albedo-poc
      ports:
        - protocol: TCP
          port: 8091
